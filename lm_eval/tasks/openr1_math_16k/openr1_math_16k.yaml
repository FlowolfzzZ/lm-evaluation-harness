tag:
  - math_word_problems
task: openr1_math_16k
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/openr1_math_16k/test.jsonl
output_type: generate_until
test_split: test
doc_to_text: "{{prompt}}\nAnswer:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
