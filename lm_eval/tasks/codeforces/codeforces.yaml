task: codeforces
dataset_path: open-r1/codeforces
dataset_name: verifiable-prompts
unsafe_code: true
output_type: generate_until
test_split: test
doc_to_text: "{{prompt}}"
doc_to_target: ""
process_results: !function utils.process_results
metric_list:
  - metric: "pass@1"
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  max_gen_toks: 32768
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
