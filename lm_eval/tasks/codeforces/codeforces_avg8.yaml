    aggregation: mean
    higher_is_better: true
  - metric: "sample@2"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@3"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@4"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@5"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@6"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@7"
    aggregation: mean
    higher_is_better: true
  - metric: "sample@8"
    aggregation: mean
    higher_is_better: true
  - metric: "avg@8"
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  max_gen_toks: 8192
  do_sample: true
  temperature: 0.7
filter_list:
  - name: "collect_responses"
    filter:
      - function: "custom"
        filter_fn: !function utils.passthrough_responses
